<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>OpenIPC Goggles Menu</title>

<style>
  /* Committed single theme. This is a goggles display over live video - a
     light variant would be wrong, so every colour is painted explicitly and
     nothing is left to the host ground. */
  :root {
    --ground: #0a0c0e;
    --panel: rgba(58, 62, 68, 0.78);
    --panel-solid: #3a3e44;
    --panel-deep: rgba(24, 27, 30, 0.82);
    --hairline: rgba(255, 255, 255, 0.28);
    --hairline-soft: rgba(255, 255, 255, 0.12);
    --text: #f2f4f6;
    --text-dim: #c9cfd6;
    --text-faint: #8d959d;
    --focus: #ffd400;
    --on: #4cd964;
    --warn: #ff9f0a;
    --bad: #ff453a;
    --rail-w: 132px;
    --panel-w: 520px;
    --row-h: 52px;
    --sans: "Roboto", "Helvetica Neue", "Segoe UI", system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* A dim scene so the panel translucency reads the way it does in goggles.
     Deliberately abstract - a fake photograph would flatter the mockup. */
  .stage {
    position: relative;
    flex: 1;
    min-height: 560px;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 22% 18%, #2a3138 0%, #151a1f 42%, #0a0c0e 78%),
      linear-gradient(178deg, #1b2228 0%, #0d1013 60%);
  }
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(100% 70% at 50% 45%, transparent 40%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
  }
  .horizon {
    position: absolute;
    left: 0; right: 0; top: 58%;
    height: 42%;
    background: linear-gradient(180deg, rgba(46,56,64,0.9) 0%, rgba(14,18,21,0.95) 100%);
    filter: blur(1.5px);
  }

  .menu {
    position: absolute;
    top: 50%;
    left: 6%;
    transform: translateY(-50%);
    display: flex;
    gap: 14px;
    z-index: 2;
  }

  /* --- left rail ------------------------------------------------------- */
  .rail {
    width: var(--rail-w);
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 5px;
    backdrop-filter: blur(2px);
    padding: 6px 0;
    display: flex;
    flex-direction: column;
  }
  .rail-item {
    appearance: none;
    background: none;
    border: 0;
    color: var(--text-dim);
    font-family: inherit;
    width: 100%;
    padding: 15px 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease;
  }
  .rail-item svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.7; }
  .rail-item .label { font-size: 11px; letter-spacing: 0.02em; }
  .rail-item:hover { color: var(--text); }
  .rail-item[aria-current="true"] {
    background: rgba(12, 14, 16, 0.55);
    color: var(--text);
  }
  .rail-item[aria-current="true"] svg { stroke: var(--focus); }
  .rail-item:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .rail-spacer { flex: 1; }

  /* --- content panel ---------------------------------------------------- */
  .panel {
    width: var(--panel-w);
    background: var(--panel);
    border: 1px solid var(--hairline);
    border-radius: 5px;
    backdrop-filter: blur(2px);
    display: flex;
    flex-direction: column;
    max-height: 460px;
  }
  .panel-title {
    text-align: center;
    font-size: 15px;
    font-weight: 500;
    padding: 13px 16px 12px;
    border-bottom: 1px solid var(--hairline-soft);
    letter-spacing: 0.01em;
  }
  .rows { overflow-y: auto; padding: 4px 0; }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: var(--row-h);
    padding: 0 16px;
    margin: 1px 6px;
    border: 2px solid transparent;
    border-radius: 3px;
    cursor: pointer;
    font-size: 14px;
    transition: background 100ms ease;
  }
  .row:hover { background: rgba(255, 255, 255, 0.05); }
  .row.is-focused {
    border-color: var(--focus);
    background: rgba(10, 12, 14, 0.55);
  }
  .row.is-static { cursor: default; }
  .row.is-static:hover { background: none; }
  .row.is-locked { cursor: not-allowed; }
  .row.is-locked .row-label { color: var(--text-faint); }
  .row.is-locked .row-value { color: var(--text-faint); }

  .row-label { flex: 1; }
  .row-note {
    display: block;
    font-size: 10.5px;
    color: var(--text-faint);
    margin-top: 2px;
    max-width: 44ch;
  }
  .row-value {
    color: var(--text-dim);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
  }
  /* A caret, not DJI's stacked stepper: this list opens rather than cycles,
     and the affordance should say which. */
  .caret { font-size: 10px; color: var(--text-dim); line-height: 1; }
  .row.is-open .caret { color: var(--focus); }
  .chev-right { color: var(--text-dim); font-size: 15px; line-height: 1; }

  /* Floated at viewport level rather than inside the row: the rows list
     scrolls, and a menu nested inside it would be clipped at the panel edge. */
  .dropdown {
    position: fixed;
    z-index: 20;
    min-width: 190px;
    max-height: 264px;
    overflow-y: auto;
    background: rgba(30, 33, 37, 0.97);
    border: 1px solid var(--hairline);
    border-radius: 4px;
    padding: 4px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
  }
  .dropdown[hidden] { display: none; }
  .dropdown button {
    appearance: none;
    background: none;
    border: 2px solid transparent;
    border-radius: 3px;
    width: 100%;
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    text-align: left;
    padding: 9px 11px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
  }
  .dropdown button:hover { background: rgba(255, 255, 255, 0.07); }
  .dropdown button.is-cursor { border-color: var(--focus); }
  .dropdown button[aria-selected="true"] { color: var(--focus); }
  .dropdown button[aria-selected="true"]::after { content: "\2713"; font-size: 12px; }

  .toggle {
    width: 44px; height: 24px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.22);
    border: 0;
    position: relative;
    cursor: pointer;
    transition: background 140ms ease;
    flex: none;
  }
  .toggle::after {
    content: "";
    position: absolute;
    top: 2px; left: 2px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: #fff;
    transition: transform 140ms ease;
  }
  .toggle[aria-pressed="true"] { background: var(--on); }
  .toggle[aria-pressed="true"]::after { transform: translateX(20px); }

  /* Status readout uses colour to encode state, not just numbers. */
  .val-good { color: var(--on); }
  .val-warn { color: var(--warn); }
  .val-bad { color: var(--bad); }

  /* --- flight view (OSD preview) ---------------------------------------- */
  .osd {
    position: absolute;
    top: 22px; right: 22px;
    width: 270px;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid var(--hairline-soft);
    border-radius: 4px;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    z-index: 2;
  }
  .osd-row { display: flex; align-items: center; gap: 8px; }

  /* The corner strip, bottom right, where the goggles keep their numbers.
     Each element is a separate toggle under Settings > Camera. */
  .strip {
    position: absolute;
    right: 22px; bottom: 18px;
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    z-index: 2;
  }
  .strip .dim { color: var(--text-dim); }
  .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
  .bars i { width: 3px; background: rgba(255,255,255,0.22); border-radius: 1px; }
  .bars i.on { background: var(--on); }

  /* --- mockup chrome, deliberately not part of the DJI design ------------ */
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px 18px;
    padding: 14px 20px;
    border-top: 1px solid rgba(255,255,255,0.1);
    background: #101317;
    font-size: 12.5px;
    color: var(--text-dim);
  }
  .controls strong { color: var(--text); font-weight: 500; }
  .seg { display: inline-flex; border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; overflow: hidden; }
  .seg button {
    appearance: none; background: none; border: 0; color: var(--text-dim);
    font-family: inherit; font-size: 12.5px; padding: 6px 14px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--focus); color: #16181a; font-weight: 500; }
  .controls kbd {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.16);
    border-radius: 3px; padding: 1px 5px; font-size: 11px; font-family: inherit;
  }
  .hidden { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
  @media (max-width: 860px) {
    .menu { left: 3%; transform: translateY(-50%) scale(0.86); transform-origin: left center; }
    .osd { transform: scale(0.86); transform-origin: top right; }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="horizon"></div>

  <!-- Flight view OSD, shown when the menu is dismissed. -->
  <div class="osd hidden" id="osd">
    <div class="osd-row">
      <span class="bars" id="bars"></span>
      <span>-64dBm 31dB</span>
    </div>
    <div class="osd-row"><span>60 fps</span><span style="color:var(--text-dim)">h265</span></div>
    <div class="osd-row">12 480 kbit/s</div>
    <div class="osd-row" style="color:var(--text-faint)">fec 2 lost 0 &nbsp; 8/12</div>
    <div class="osd-row val-bad">● REC</div>
  </div>

  <div class="strip hidden" id="strip">
    <span class="dim">04:17</span>
    <span>22.1V&nbsp; 68%</span>
    <span>12.5 Mbps</span>
    <span class="dim">▯ 84%</span>
  </div>

  <div class="menu" id="menu">
    <nav class="rail" id="rail" aria-label="Sections"></nav>
    <section class="panel">
      <h1 class="panel-title" id="panelTitle">Transmission</h1>
      <div class="rows" id="rows"></div>
    </section>
  </div>
</div>

<div class="dropdown" id="dropdown" role="listbox" hidden></div>

<div class="controls">
  <div class="seg" role="group" aria-label="Preview">
    <button id="viewMenu" aria-pressed="true">Menu</button>
    <button id="viewFlight" aria-pressed="false">Flight view</button>
  </div>
  <span><strong>Move</strong> <kbd>↑</kbd><kbd>↓</kbd> &nbsp; <strong>Open list</strong> <kbd>Enter</kbd> or click &nbsp; <strong>Nudge</strong> <kbd>←</kbd><kbd>→</kbd> &nbsp; <strong>Close</strong> <kbd>Esc</kbd></span>
  <span style="color:var(--text-faint)">Rows greyed out are in the SBC menu but cannot be served by a phone.</span>
</div>

<script>
  // Icons follow DJI's rail: line art, single weight, no fill.
  const ICONS = {
    status: '<svg viewBox="0 0 24 24"><path d="M4 20V10M9.5 20V4M15 20v-8M20.5 20v-5"/></svg>',
    album: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="10" r="1.6"/><path d="M21 16l-5-5-5.5 8"/></svg>',
    transmission: '<svg viewBox="0 0 24 24"><path d="M3 9h15l-3.5-3.5M21 15H6l3.5 3.5"/></svg>',
    settings: '<svg viewBox="0 0 24 24"><path d="M12 3.5l7.4 4.25v8.5L12 20.5 4.6 16.25v-8.5z"/><circle cx="12" cy="12" r="3"/></svg>',
    more: '<svg viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg>'
  };

  // Every row below is a real item from the ported gsmenu tree, keeping its
  // upstream "<target> <section> <item>" path. DJI's five rail entries map
  // almost one-to-one onto the sections we already have.
  const SECTIONS = [
    {
      id: 'status', label: 'Status', title: 'Status',
      rows: [
        { label: 'Link', value: 'Connected', tone: 'good', static: true },
        { label: 'Signal', value: '-64 dBm', static: true },
        { label: 'SNR', value: '31 dB', tone: 'good', static: true },
        { label: 'Antennas', value: '2', static: true },
        { label: 'FEC recovered / lost', value: '2 / 0', static: true },
        { label: 'Bitrate', value: '12 480 kbit/s', static: true },
        { label: 'Video', value: 'H.265 · 60 fps', static: true },
        { label: 'gs.key', value: 'Loaded', tone: 'good', static: true }
      ]
    },
    {
      id: 'album', label: 'Album', title: 'Album',
      rows: [
        { label: 'flight-20260812-1043.h265', note: '1.4 GB · 12:04', value: 'Play', chevron: true },
        { label: 'flight-20260811-2251.h265', note: '620 MB · 5:31', value: 'Play', chevron: true },
        { label: 'Storage', value: '38.2 GB free', static: true },
        { label: 'Delete all recordings', chevron: true }
      ]
    },
    {
      id: 'transmission', label: 'Transmission', title: 'Transmission',
      rows: [
        { path: 'gs wfbng gs_channel', label: 'Channel', options: ['36','40','44','48','149','153','157','161','165'], index: 7 },
        { path: 'gs wfbng bandwidth', label: 'Bandwidth', options: ['20','40'], index: 0, suffix: ' MHz' },
        { path: 'gs wfbng txpower', label: 'TX power', options: ['1','10','20','30','40','50','60'], index: 3 },
        { path: 'gs wfbng adaptivelink', label: 'Adaptive link', toggle: true, on: true,
          note: 'Feeds link quality back to the air unit.' },
        { path: 'gs system rx_mode', label: 'RX mode', options: ['wfb','apfpv'], index: 0,
          note: 'wfb needs an adapter; apfpv joins the air unit’s own network.' },
        { path: 'air wfbng power', label: 'Air TX power', value: '—', locked: true,
          note: 'Needs an SSH connection to the air unit.' },
        { path: 'air wfbng air_channel', label: 'Air channel', value: '—', locked: true,
          note: 'Needs an SSH connection to the air unit.' }
      ]
    },
    {
      id: 'settings', label: 'Settings', title: 'Camera',
      rows: [
        { path: 'gs system rx_codec', label: 'Video Coding Format', options: ['auto','h264','h265'], index: 2 },
        { path: 'gs system video_scale', label: 'Video scale', options: ['50','75','100'], index: 2, suffix: '%' },
        { path: 'gs system rec_enabled', label: 'Auto Record on Start', toggle: true, on: true },
        { path: 'gs system dvr_mode', label: 'Record With', options: ['raw','reencode','both'], index: 0,
          note: 'Only raw is implemented: the stream has no reliable timestamps.' },
        { path: 'gs system dvr_max_size', label: 'DVR max size', options: ['5','10','20','40'], index: 2, suffix: ' GB' },
        { path: 'gs app osd', label: 'Show OSD', toggle: true, on: true },
        { path: 'gs app no_signal', label: 'No-signal background', options: ['drift','black','grey'], index: 0,
          note: 'Drift moves a soft gradient so an OLED cannot stain.' },
        { path: 'gs app strip_flight_time', label: 'Show flight time', toggle: true, on: true },
        { path: 'gs app strip_craft_battery', label: 'Show craft battery', toggle: true, on: true },
        { path: 'gs app strip_signal', label: 'Show signal', toggle: true, on: false,
          note: 'The metrics box in the opposite corner already draws it.' },
        { path: 'gs app strip_bitrate', label: 'Show bitrate', toggle: true, on: true },
        { path: 'gs app strip_fps', label: 'Show frame rate', toggle: true, on: false },
        { path: 'gs app strip_phone_battery', label: 'Show phone battery', toggle: true, on: true },
        { path: 'gs system dvr_reenc_codec', label: 'DVR re-encode codec', value: '—', locked: true },
        { path: 'gs system connector', label: 'Connector', value: 'HDMI', locked: true,
          note: 'SBC-only; the phone renders to its own screen.' },
        { path: 'gs system audio', label: 'Audio', value: 'Off', locked: true }
      ]
    },
    {
      id: 'more', label: 'More', title: 'More',
      rows: [
        { label: 'APFPV', value: 'Inactive', chevron: true },
        { label: 'WiFi', value: 'Android settings', locked: true, chevron: true },
        { label: 'MAVLink endpoints', value: '2 active', chevron: true },
        { label: 'Import gs.key', chevron: true },
        { label: 'Diagnostics', chevron: true },
        { label: 'About', value: 'v0.1.0', chevron: true }
      ]
    }
  ];

  let sectionIndex = 2;   // Transmission, the section a pilot opens most.
  let rowIndex = 0;
  let openIndex = null;   // row whose value list is open, if any
  let optionCursor = 0;   // highlighted entry inside that list

  const rail = document.getElementById('rail');
  const rowsEl = document.getElementById('rows');
  const titleEl = document.getElementById('panelTitle');

  function buildRail() {
    rail.innerHTML = '';
    SECTIONS.forEach((section, i) => {
      const button = document.createElement('button');
      button.className = 'rail-item';
      button.type = 'button';
      button.setAttribute('aria-current', String(i === sectionIndex));
      button.innerHTML = ICONS[section.id] + '<span class="label">' + section.label + '</span>';
      button.addEventListener('click', () => {
        sectionIndex = i;
        rowIndex = 0;
        openIndex = null;
        dropdownEl.hidden = true;
        render();
      });
      rail.appendChild(button);
      if (section.id === 'settings') {
        const spacer = document.createElement('div');
        spacer.className = 'rail-spacer';
        rail.appendChild(spacer);
      }
    });
  }

  function valueText(row) {
    if (row.options) return row.options[row.index] + (row.suffix || '');
    return row.value || '';
  }

  const dropdownEl = document.getElementById('dropdown');

  function closeDropdown() {
    if (openIndex === null) return;
    openIndex = null;
    dropdownEl.hidden = true;
    render();
  }

  function commitOption(index) {
    const row = SECTIONS[sectionIndex].rows[openIndex];
    if (row) row.index = index;
    closeDropdown();
  }

  function openDropdown(i) {
    const row = SECTIONS[sectionIndex].rows[i];
    if (!row || !row.options || row.locked) return;
    openIndex = i;
    optionCursor = row.index;
    render();
    paintDropdown();
  }

  function paintDropdown() {
    if (openIndex === null) { dropdownEl.hidden = true; return; }
    const row = SECTIONS[sectionIndex].rows[openIndex];
    const anchor = rowsEl.children[openIndex];
    if (!row || !anchor) { dropdownEl.hidden = true; return; }

    dropdownEl.innerHTML = '';
    row.options.forEach((option, index) => {
      const button = document.createElement('button');
      button.type = 'button';
      button.setAttribute('role', 'option');
      button.setAttribute('aria-selected', String(index === row.index));
      if (index === optionCursor) button.classList.add('is-cursor');
      const text = document.createElement('span');
      text.textContent = option + (row.suffix || '');
      button.appendChild(text);
      button.addEventListener('click', (event) => {
        event.stopPropagation();
        commitOption(index);
      });
      dropdownEl.appendChild(button);
    });

    dropdownEl.hidden = false;
    // Measure first, then place: the list is anchored to the row's right edge
    // and flips above when it would run off the bottom.
    const rect = anchor.getBoundingClientRect();
    const height = dropdownEl.offsetHeight;
    const width = dropdownEl.offsetWidth;
    let top = rect.bottom + 4;
    if (top + height > window.innerHeight - 8) {
      top = Math.max(8, rect.top - height - 4);
    }
    let left = rect.right - width;
    if (left < 8) left = 8;
    dropdownEl.style.top = top + 'px';
    dropdownEl.style.left = left + 'px';

    const cursor = dropdownEl.querySelector('.is-cursor');
    if (cursor) cursor.scrollIntoView({ block: 'nearest' });
  }

  function render() {
    buildRail();
    const section = SECTIONS[sectionIndex];
    titleEl.textContent = section.title;
    rowsEl.innerHTML = '';

    section.rows.forEach((row, i) => {
      const el = document.createElement('div');
      el.className = 'row';
      if (i === rowIndex) el.classList.add('is-focused');
      if (row.locked) el.classList.add('is-locked');
      if (row.static) el.classList.add('is-static');

      const label = document.createElement('div');
      label.className = 'row-label';
      label.textContent = row.label;
      if (row.note) {
        const note = document.createElement('span');
        note.className = 'row-note';
        note.textContent = row.note;
        label.appendChild(note);
      }
      el.appendChild(label);

      if (row.toggle) {
        const toggle = document.createElement('button');
        toggle.className = 'toggle';
        toggle.type = 'button';
        toggle.setAttribute('aria-pressed', String(!!row.on));
        toggle.setAttribute('aria-label', row.label);
        toggle.addEventListener('click', (event) => {
          event.stopPropagation();
          row.on = !row.on;
          rowIndex = i;
          render();
        });
        el.appendChild(toggle);
      } else {
        const value = document.createElement('div');
        value.className = 'row-value';
        if (row.tone) value.classList.add('val-' + row.tone);
        const text = document.createElement('span');
        text.textContent = valueText(row);
        value.appendChild(text);
        if (row.options && !row.locked) {
          const caret = document.createElement('span');
          caret.className = 'caret';
          caret.textContent = '▼';
          value.appendChild(caret);
        } else if (row.chevron) {
          const chev = document.createElement('span');
          chev.className = 'chev-right';
          chev.textContent = '›';
          value.appendChild(chev);
        }
        el.appendChild(value);
      }

      el.addEventListener('click', () => {
        const wasOpen = openIndex === i;
        rowIndex = i;
        openIndex = null;
        render();
        if (row.options && !row.locked && !wasOpen) openDropdown(i);
      });
      if (openIndex === i) el.classList.add('is-open');
      rowsEl.appendChild(el);
    });

    paintDropdown();
  }

  function step(delta) {
    const row = SECTIONS[sectionIndex].rows[rowIndex];
    if (!row || row.locked) return;
    if (row.toggle) { row.on = !row.on; render(); return; }
    if (!row.options) return;
    row.index = (row.index + delta + row.options.length) % row.options.length;
    render();
  }

  document.addEventListener('keydown', (event) => {
    const rows = SECTIONS[sectionIndex].rows;

    // With a list open the arrows belong to it, not to the rows behind.
    if (openIndex !== null) {
      const options = rows[openIndex].options;
      if (event.key === 'ArrowDown') {
        optionCursor = (optionCursor + 1) % options.length;
        paintDropdown(); event.preventDefault();
      } else if (event.key === 'ArrowUp') {
        optionCursor = (optionCursor - 1 + options.length) % options.length;
        paintDropdown(); event.preventDefault();
      } else if (event.key === 'Enter') {
        commitOption(optionCursor); event.preventDefault();
      } else if (event.key === 'Escape') {
        closeDropdown(); event.preventDefault();
      }
      return;
    }

    if (event.key === 'ArrowDown') { rowIndex = (rowIndex + 1) % rows.length; render(); event.preventDefault(); }
    else if (event.key === 'ArrowUp') { rowIndex = (rowIndex - 1 + rows.length) % rows.length; render(); event.preventDefault(); }
    else if (event.key === 'Enter') {
      // Enter opens the list; the arrows still nudge a value without it, which
      // is quicker for a two-option row and matches how goggle buttons work.
      const row = rows[rowIndex];
      if (row && row.toggle) { row.on = !row.on; render(); }
      else openDropdown(rowIndex);
      event.preventDefault();
    }
    else if (event.key === 'ArrowRight') { step(1); event.preventDefault(); }
    else if (event.key === 'ArrowLeft') { step(-1); event.preventDefault(); }
  });

  // Dismissal: anywhere outside, or any movement that would leave the list
  // pointing at the wrong row.
  document.addEventListener('pointerdown', (event) => {
    if (openIndex === null) return;
    if (dropdownEl.contains(event.target)) return;
    if (rowsEl.children[openIndex] && rowsEl.children[openIndex].contains(event.target)) return;
    closeDropdown();
  });
  rowsEl.addEventListener('scroll', closeDropdown);
  window.addEventListener('resize', closeDropdown);

  // Signal bars, banded exactly as osd.json does it.
  const bars = document.getElementById('bars');
  const filled = 4;
  for (let i = 0; i < 6; i++) {
    const bar = document.createElement('i');
    bar.style.height = (4 + i * 2) + 'px';
    if (i < filled) bar.classList.add('on');
    bars.appendChild(bar);
  }

  const menu = document.getElementById('menu');
  const osd = document.getElementById('osd');
  const strip = document.getElementById('strip');
  const viewMenu = document.getElementById('viewMenu');
  const viewFlight = document.getElementById('viewFlight');
  function setView(showMenu) {
    if (!showMenu) closeDropdown();
    menu.classList.toggle('hidden', !showMenu);
    osd.classList.toggle('hidden', showMenu);
    strip.classList.toggle('hidden', showMenu);
    viewMenu.setAttribute('aria-pressed', String(showMenu));
    viewFlight.setAttribute('aria-pressed', String(!showMenu));
  }
  viewMenu.addEventListener('click', () => setView(true));
  viewFlight.addEventListener('click', () => setView(false));

  render();
</script>
</body>
</html>
