name: android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Deliberately not recursive: devourer keeps vendor kernel drivers
          # under reference/ as nested submodules, one of which points at a
          # commit its upstream no longer serves. None of them are compiled
          # here, and recursing into them breaks the checkout.
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install the NDK
        run: sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: openipc-mobile-gs-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
